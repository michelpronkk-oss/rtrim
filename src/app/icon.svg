<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">

  <rect width="100" height="100" rx="22" fill="#07071A"/>

  <defs>
    <!--
      Blue (#4E65FF) at the top, grape-violet (#6E30CC) at the bottom.
      Tilted slightly right to match the reference gradient direction.
    -->
    <linearGradient id="g" x1="44" y1="20" x2="64" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4E65FF"/>
      <stop offset="100%" stop-color="#6E30CC"/>
    </linearGradient>
  </defs>

  <!--
    The mark is four separate filled shapes, all sharing the same gradient.
    They touch / overlap at shared edges, so they render as one unified form.

    ── TOP HORIZONTAL BAR ──────────────────────────────────────────
    Full-width rectangular bar. x 25–83, y 20–33 (13 px tall).
  -->
  <rect x="25" y="20" width="58" height="13" fill="url(#g)"/>

  <!--
    ── SHOULDER ARM ────────────────────────────────────────────────
    Triangle hanging from the bar's right end, pointing down-left.

    Vertices:
      (83, 20) — top-right corner of bar
      (56, 47) — arm tip
      (83, 33) — bottom-right corner of bar

    At the bar-bottom level (y = 33):
      Outer arm edge is at x ≈ 83 − 27·(13/27) = 70  →  arm width = 83 − 70 = 13 px
    This matches the bar height exactly, giving the arm the same visual weight.

    Both the bar rect and this triangle are filled with the same gradient,
    so they visually merge into one L-shaped top section with no seam.
  -->
  <polygon points="83,20 56,47 83,33" fill="url(#g)"/>

  <!--
    ── LEFT VERTICAL STEM ──────────────────────────────────────────
    13 px wide, full cap-height y 20–88.
    Overlaps the bar at the top; merges seamlessly due to shared gradient.
  -->
  <rect x="25" y="20" width="13" height="68" fill="url(#g)"/>

  <!--
    ── DIAGONAL LEG ────────────────────────────────────────────────
    Parallelogram: 14 px wide, ~45° angle (Δx ≈ Δy from top-left to bottom-right).

    Top-left  (38, 46): flush with stem right edge (x = 38), just above arm tip y
    Top-right (52, 46): 14 px wide
    Bot-right (80, 88): Δx = 42, Δy = 42 from top-left — exactly 45°
    Bot-left  (66, 88): 14 px wide
  -->
  <polygon points="38,46 52,46 80,88 66,88" fill="url(#g)"/>

</svg>
