<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="44" y1="0" x2="64" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#4E65FF"/>
      <stop offset="100%" stop-color="#6E30CC"/>
    </linearGradient>
  </defs>

  <!-- Gradient background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Mark shapes in white, matching the favicon (icon.tsx) treatment -->
  <!-- Top horizontal bar -->
  <rect x="25" y="20" width="58" height="13" fill="rgba(255,255,255,0.95)"/>
  <!-- Shoulder arm -->
  <polygon points="83,20 56,47 83,33" fill="rgba(255,255,255,0.95)"/>
  <!-- Left vertical stem -->
  <rect x="25" y="20" width="13" height="68" fill="rgba(255,255,255,0.95)"/>
  <!-- Diagonal leg -->
  <polygon points="38,46 52,46 80,88 66,88" fill="rgba(255,255,255,0.95)"/>
</svg>
